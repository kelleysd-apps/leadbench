name: leak scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  leak-scan:
    name: leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run leakscan
        run: python3 tools/leakscan.py
